[project]
name = "pydantic-course"
version = "0.1.0"
description = "Pydantic course examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.2.8",
    "email-validator>=2.3.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pydantic-ai>=2.18.0",
    "pydantic[email]>=2.12.5",
]

 [[tool.uv.index]]
 url = "https://mirror2.chabokan.net/pypi/simple/" 
 default = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "notebook>=7.5.5",
]
